name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        env:
          # Repo variable, e.g. its-me.kodexa.in. Empty → served at /<repo>/ on github.io.
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          VITE_WEB3FORMS_KEY: ${{ secrets.VITE_WEB3FORMS_KEY }}
          # Repo variable with your GoatCounter code (e.g. rahulraj). Empty → analytics off.
          VITE_GOATCOUNTER: ${{ vars.GOATCOUNTER_CODE }}
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then BASE="/"; else BASE="/${{ github.event.repository.name }}/"; fi
          npx vite build --base="$BASE"
          cp dist/index.html dist/404.html
          if [ -n "$CUSTOM_DOMAIN" ]; then echo "$CUSTOM_DOMAIN" > dist/CNAME; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
